; AzanClock: LAN time server for the AzanTV television (the TV has no RTC).
; Board: generic ESP32 DevKit (WROOM-32) + DS3231 RTC module (I2C, optional).
;
; Time sources, best first:
;   1. Internet SNTP (when the home Wi-Fi has internet)
;   2. A phone that joins the open "AzanClock" Wi-Fi (captive page sends its clock)
;   3. DS3231 RTC (battery-backed, survives power cuts)
; The ESP32 then answers NTP requests on UDP 123 for the TV.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/RTClib @ ^2.1.4
